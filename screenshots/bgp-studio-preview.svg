<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDarkBgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="accentGradBgp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkBgp)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0b1021" stroke="#1a233f" stroke-width="1.5"/>
  <rect x="46" y="38" width="32" height="32" rx="8" fill="url(#accentGradBgp)"/>
  <text x="62" y="59" fill="#000000" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" text-anchor="middle">BG</text>
  
  <text x="90" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">BGPCommunityForge Pro</text>
  <text x="330" y="55" fill="#f59e0b" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="380" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| BGP Community Matrix &amp; Route Leak Shield</text>

  <rect x="910" y="40" width="115" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
  <text x="967" y="58" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 1997 / 8092</text>

  <rect x="1035" y="40" width="120" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1095" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 9234 SHIELD</text>

  <!-- Left Column: Traffic Engineering Studio -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0b1021" stroke="#1a233f" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">1. BGP Traffic Engineering Studio</text>
  
  <rect x="400" y="113" width="165" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="482" y="129" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">ZERO-TRUST VERIFIED</text>

  <!-- Metrics row -->
  <rect x="50" y="150" width="155" height="60" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="127" y="178" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="15" text-anchor="middle">AS65001</text>
  <text x="127" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">LOCAL AS (ORIGIN)</text>

  <rect x="230" y="150" width="155" height="60" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="307" y="178" fill="#22d3ee" font-family="monospace" font-weight="700" font-size="13" text-anchor="middle">Lumen (AS3356)</text>
  <text x="307" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">TARGET UPSTREAM</text>

  <rect x="410" y="150" width="155" height="60" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="487" y="178" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Protected</text>
  <text x="487" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">ROUTE LEAK SHIELD</text>

  <!-- Prefix List -->
  <text x="50" y="240" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Advertised IP Prefixes (CIDR)</text>
  <rect x="50" y="250" width="515" height="50" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="65" y="280" fill="#38bdf8" font-family="monospace" font-size="12">198.51.100.0/24</text>

  <!-- Community Matrix Configuration -->
  <text x="50" y="325" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Attached BGP Communities</text>
  <rect x="50" y="340" width="515" height="150" rx="8" fill="#070b18" stroke="#f59e0b" stroke-width="1.5"/>

  <text x="65" y="365" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Standard Communities:</text>
  <text x="210" y="365" fill="#fbbf24" font-family="monospace" font-size="11">3356:100 (Local Pref 100), 65535:65281 (NO_EXPORT)</text>

  <text x="65" y="395" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Large Communities (RFC 8092):</text>
  <text x="250" y="395" fill="#22d3ee" font-family="monospace" font-size="11">65001:100:1 (Tier-1 Primary Marking)</text>

  <text x="65" y="425" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">AS-Path Prepending:</text>
  <text x="210" y="425" fill="#34d399" font-family="monospace" font-size="11">1x Prepend (AS65001)</text>

  <text x="65" y="455" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Private ASN Scrubbing:</text>
  <text x="210" y="455" fill="#34d399" font-family="monospace" font-size="11">Enforced (remove-private-as enabled)</text>

  <text x="65" y="478" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">&bull; Transit-to-Transit re-export blocked by default (RFC 9234 compliant)</text>

  <!-- Provider Matrix Box -->
  <text x="50" y="520" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Tier-1 Provider Alignment</text>
  <rect x="50" y="533" width="515" height="90" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="65" y="560" fill="#fbbf24" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">Lumen (CenturyLink / Level 3 - AS3356)</text>
  <text x="65" y="580" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Supported: LP 70-110 (3356:70-110) &bull; Prepend 1-3x (3356:2011-2013) &bull; Blackhole (3356:9999)</text>
  <text x="65" y="605" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10">Active: 3356:100 (Default Customer Route) aligned with target provider</text>

  <!-- Right Column: Audit Scorecard & Synthesizer -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0b1021" stroke="#1a233f" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="75" rx="10" fill="#0c1730" stroke="#1a233f"/>
  <rect x="650" y="132" width="60" height="50" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="680" y="167" fill="#34d399" font-family="monospace" font-weight="800" font-size="26" text-anchor="middle">A+</text>
  <text x="730" y="152" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">Score: 100 / 100</text>
  <text x="730" y="172" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">Zero-Trust Verified • Route Leak Shield Active</text>

  <!-- Checklist items -->
  <rect x="635" y="210" width="515" height="36" rx="6" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="233" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Route Leak Prevention (20/20 pts) - Foreign transit leaks blocked</text>

  <rect x="635" y="252" width="515" height="36" rx="6" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="275" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ RFC 9234 Only to Customer (15/15 pts) - OTC role enforced</text>

  <rect x="635" y="294" width="515" height="36" rx="6" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="317" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Prefix Subnet Hygiene (10/10 pts) - 198.51.100.0/24 valid /24</text>

  <rect x="635" y="336" width="515" height="36" rx="6" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="359" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ Private ASN Scrubbing (10/10 pts) - remove-private-as active</text>

  <rect x="635" y="378" width="515" height="36" rx="6" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="401" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">✅ AS-Path Prepending (10/10 pts) - Bounded to 1x prepend</text>

  <!-- Synthesizer Box -->
  <text x="635" y="440" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Multi-Vendor BGP Policy Synthesizer (Cisco / Juniper / BIRD)</text>
  <rect x="635" y="455" width="515" height="170" rx="8" fill="#070b18" stroke="#1a233f"/>
  <text x="650" y="480" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Cisco IOS-XE Configuration Output:</text>
  <text x="650" y="505" fill="#38bdf8" font-family="monospace" font-size="11">route-map RM-UPSTREAM-OUT permit 10</text>
  <text x="665" y="525" fill="#38bdf8" font-family="monospace" font-size="11">match ip address prefix-list PL-BGP-OUT</text>
  <text x="665" y="545" fill="#fbbf24" font-family="monospace" font-size="11">set community 3356:100 no-export additive</text>
  <text x="665" y="565" fill="#22d3ee" font-family="monospace" font-size="11">set large-community 65001:100:1 additive</text>
  <text x="665" y="585" fill="#34d399" font-family="monospace" font-size="11">set as-path prepend 65001</text>
  <text x="650" y="612" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">&bull; 1-click export for Cisco IOS-XE, Juniper JunOS, Arista EOS, BIRD 2, and FRR</text>
</svg>
